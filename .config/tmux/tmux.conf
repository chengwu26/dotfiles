# ╭──────────────────────────────────────────────────────────╮
# │                         Plugins                          │
# ╰──────────────────────────────────────────────────────────╯

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

%hidden tpm_home="${XDG_DATA_HOME}/tmux/tpm"
if "test ! -d ${tpm_home}" \
   "run 'mkdir -p ${tpm_home} && git clone https://github.com/tmux-plugins/tpm ${tpm_home} \
      && ${tpm_home}/bin/install_plugins'"
run "${tpm_home}/tpm"


# ╭──────────────────────────────────────────────────────────╮
# │                         Themes                           │
# ╰──────────────────────────────────────────────────────────╯

%hidden mauve='#cba6f7'
%hidden red='#f38ba8'
%hidden yellow='#f9e2af'
%hidden lavender='#b4befe'
%hidden text='#cdd6f4'
%hidden subtext1='#bac2de'
%hidden subtext0='#a6adc8'
%hidden overlay1='#7f849c'
%hidden overlay0='#6c7086'
%hidden surface1='#45475a'
%hidden surface0='#313244'
%hidden base='#1e1e2e'
%hidden crust='#11111b'

set -g window-status-format " #W#{?window_zoomed_flag, 󰁌 , }"
set -g window-status-style "fg=${overlay0}"
set -g window-status-current-format ' #W#{?window_zoomed_flag, 󰁌 , }'
set -g window-status-current-style "bg=${mauve},fg=${base}"
set -g window-status-last-style "fg=${subtext0}"
set -g window-status-bell-style "fg=${red},blink"

set -g status-style "bg=${base}"
set -g status-left ''
set -g status-right '  #S |  %m-%d %H:%M '
set -g status-right-style "#{?client_prefix,bg=${yellow}#,fg=${crust},fg=${subtext0}}"

set -g pane-border-style "fg=${surface1}"
set -g pane-active-border-style "fg=${lavender}"

set -g message-style "fg=${mauve},bg=${crust}"
set -g message-command-style "fg=${yellow},bg=${crust}"

set -g mode-style "bg=${surface0},fg=${subtext1}"
set -g copy-mode-match-style "bg=${overlay1},fg=${text}"
set -g copy-mode-current-match-style "bg=${yellow},fg=${base}"


# ╭──────────────────────────────────────────────────────────╮
# │                         Options                          │
# ╰──────────────────────────────────────────────────────────╯

# General
set -g mouse on
set -g allow-rename on
set -g escape-time 0
set -g repeat-time 0
set -g history-limit 50000
set -g display-time 5000  # Increase the message display time
set -s focus-events on
set -s extended-keys on
setw -g aggressive-resize on
set -sa terminal-overrides ",xterm*:Tc"  # True color

# Index start from 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on


# ╭──────────────────────────────────────────────────────────╮
# │                         Keybind                          │
# ╰──────────────────────────────────────────────────────────╯

# Basic
unbind 'C-b'
set -g prefix 'C-Space'
bind 'C-Space' send-prefix
bind 'Space' last-window
bind 'r' source-file "${XDG_CONFIG_HOME}/tmux/tmux.conf"  # Reload config

# Pane
bind 'f' resize-pane -Z  # Zoom current pane
# Resize pane
bind -n 'M-Up' resize-pane -U 1
bind -n 'M-Down' resize-pane -D 1
bind -n 'M-Left' resize-pane -L 1
bind -n 'M-Right' resize-pane -R 1
# Integrated Neovim
bind -n 'C-h' if-shell "[ #{pane_current_command} = nvim ]" "send-keys C-h" "select-pane -L"
bind -n 'C-j' if-shell "[ #{pane_current_command} = nvim ]" "send-keys C-j" "select-pane -D"
bind -n 'C-k' if-shell "[ #{pane_current_command} = nvim ]" "send-keys C-k" "select-pane -U"
bind -n 'C-l' if-shell "[ #{pane_current_command} = nvim ]" "send-keys C-l" "select-pane -R"

# Window
bind 'c' new-window -c '#{pane_current_path}'
# Swap window
bind -n 'C-S-Left' swap-window -t -1\; select-window -t -1
bind -n 'C-S-Right' swap-window -t +1\; select-window -t +1
# Split window
unbind '"'
bind '\' split-window -vc '#{pane_current_path}'
unbind '%'
bind '|' split-window -hc '#{pane_curent_path}'

# Copy mode
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Jump to last command
bind b copy-mode\;\
  send-keys -X start-of-lin\;\
  send-keys -X search-backward '❯'
