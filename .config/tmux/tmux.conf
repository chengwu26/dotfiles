# ╭──────────────────────────────────────────────────────────╮
# │                         Plugins                          │
# ╰──────────────────────────────────────────────────────────╯

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'christoomey/vim-tmux-navigator'

if "test ! -d ${XDG_CONFIG_HOME}/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ${XDG_CONFIG_HOME}/tmux/plugins/tpm \
      && ${XDG_CONFIG_HOME}/tmux/plugins/tpm/bin/install_plugins'"
run "${XDG_CONFIG_HOME}/tmux/plugins/tpm/tpm"


# ╭──────────────────────────────────────────────────────────╮
# │                         Themes                           │
# ╰──────────────────────────────────────────────────────────╯

set -g message-style 'fg=#cba6f7,bg=#11111b'
set -g message-command-style 'fg=#f9e2af,bg=#11111b'

set -g mode-style 'bg=#313244,fg=#bac2de'
set -g copy-mode-match-style 'bg=#7f849c,fg=#cdd6f4'
set -g copy-mode-current-match-style 'bg=#f9e2af,fg=#1e1e2e'
set -g pane-border-style 'fg=#45475a'
set -g pane-active-border-style 'fg=#b4befe'

set -g status-style 'bg=#1e1e2e'
set -g status-left ''
set -g status-right '  #S |  %m-%d %H:%M '
set -g status-right-style '#{?client_prefix,bg=#f9e2af#,fg=#11111b,fg=#a6adc8}'

set -g window-status-format ' #W#{?window_zoomed_flag, 󰁌 , }'
set -g window-status-style 'fg=#6c7086'

set -g window-status-current-format ' #W#{?window_zoomed_flag, 󰁌 , }'
set -g window-status-current-style 'bg=#cba6f7,fg=#1e1e2e'

set -g window-status-last-style 'fg=#a6adc8'
set -g window-status-bell-style 'fg=#f38ba8,blink'


# ╭──────────────────────────────────────────────────────────╮
# │                         Options                          │
# ╰──────────────────────────────────────────────────────────╯

# General
set -g mouse on
set -g allow-rename on
set -g escape-time 0
set -g repeat-time 0
set -g history-limit 50000
setw -g aggressive-resize on
set -s focus-events on
set -s extended-keys on
set -g display-time 5000 # increase the message display time

# True color
set -as terminal-overrides ",xterm*:Tc"
set -sa terminal-features ',xterm-kitty:RGB'

# Index start from 1
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on


# ╭──────────────────────────────────────────────────────────╮
# │                         Keybind                          │
# ╰──────────────────────────────────────────────────────────╯

# basic
unbind 'C-b'
set -g prefix 'C-Space'
bind 'C-Space' send-prefix
bind 'Space' last-window
bind 'r' source-file "${XDG_CONFIG_HOME}/tmux/tmux.conf" # reload config
bind 'f' resize-pane -Z

# Pane
bind -n 'C-h' if-shell "[ #{pane_current_command} = nvim ]" "send-keys C-h" "select-pane -L"
bind -n 'C-j' if-shell "[ #{pane_current_command} = nvim ]" "send-keys C-j" "select-pane -D"
bind -n 'C-k' if-shell "[ #{pane_current_command} = nvim ]" "send-keys C-k" "select-pane -U"
bind -n 'C-l' if-shell "[ #{pane_current_command} = nvim ]" "send-keys C-l" "select-pane -R"

# new pane
unbind '"'
unbind '%'
bind '\' split-window -c '#{pane_current_path}'
bind '|' split-window -hc '#{pane_curent_path}'
# resize pane
bind -n 'M-Up' resize-pane -U 1
bind -n 'M-Down' resize-pane -D 1
bind -n 'M-Left' resize-pane -L 1
bind -n 'M-Right' resize-pane -R 1

# Window
bind 'c' new-window -c '#{pane_current_path}'
# bind -n 'M-h' previous-window
# bind -n 'M-l' next-window
# swap window
bind -n 'C-S-Left' swap-window -t -1\; select-window -t -1
bind -n 'C-S-Right' swap-window -t +1\; select-window -t +1

# Copy mode
bind -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'C-v' send -X rectangle-toggle
bind -T copy-mode-vi 'y' send -X copy-selection-and-cancel

bind b copy-mode\;\
  send-keys -X start-of-lin\;\
  send-keys -X search-backward '❯'
